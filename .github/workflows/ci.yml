name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.5' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pyrefly check
      - run: pytest -q
      - run: python examples/quickstart.py
      - run: python examples/custom_hook.py
      - run: python -m build
